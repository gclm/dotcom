# Dotcom Workflow Feature Development With Specs And Plans

## Action

Follow the feature-development-with-specs-and-plans workflow:
1. Create or update docs/superpowers/plans/{date}-{feature}.md with a plan.
2. Create or update docs/superpowers/specs/{date}-{feature}-design.md with a design/spec.
3. Modify or add relevant source files under src/ to implement the feature.
4. Update configuration or supporting files as needed (e.g., package.json, wrangler.jsonc, .gitignore).

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: docs/superpowers/plans/*.md, docs/superpowers/specs/*-design.md, src/**

